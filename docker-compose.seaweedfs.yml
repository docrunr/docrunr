# SeaweedFS S3-compatible storage overlay. When combining with `docker-compose.llm.yml`,
# list this file **last** so `STORAGE_TYPE=s3` wins over the LLM overlay defaults.

services:
  seaweedfs:
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:latest}
    command: mini -dir=/data -s3
    restart: unless-stopped
    ports:
      - "${S3_PORT:-8333}:8333"
      - "${SEAWEEDFS_MASTER_PORT:-9333}:9333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    depends_on:
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      STORAGE_TYPE: s3
      STORAGE_BASE_PATH: ${STORAGE_BASE_PATH:-/data}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-docrunr}
      S3_REGION: ${S3_REGION:-us-east-1}

  worker-llm:
    depends_on:
      rabbitmq:
        condition: service_healthy
      litellm:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      STORAGE_TYPE: s3
      STORAGE_BASE_PATH: ${STORAGE_BASE_PATH:-/data}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-docrunr}
      S3_REGION: ${S3_REGION:-us-east-1}

  api:
    depends_on:
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      STORAGE_TYPE: s3
      STORAGE_BASE_PATH: ${STORAGE_BASE_PATH:-/data}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-docrunr}
      S3_REGION: ${S3_REGION:-us-east-1}

volumes:
  seaweedfs-data:
    name: docrunr-seaweedfs-data
