[project]
name = "docrunr-api"
version = "0.1.2"
description = "Local HTTP API gateway for DocRunr workers."
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "DocRunr Contributors" }]
dependencies = [
    "docrunr-runtime",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.51.0",
]

[project.scripts]
docrunr-api = "docrunr_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docrunr_api"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
