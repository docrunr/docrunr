# Default local stack: TXT + LLM workers, public API, LiteLLM, Ollama, ./.data.
# For workers-only (own/platform API): omit docker-compose.api.yml — see README.
include:
  - docker-compose.base.yml
  - docker-compose.local.yml
  - docker-compose.llm.yml
  - docker-compose.api.yml
  - docker-compose.ollama.yml
