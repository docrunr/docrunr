[project]
name = "docrunr-runtime"
version = "0.1.2"
description = "Shared storage and messaging primitives for DocRunr services."
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "DocRunr Contributors" }]
dependencies = [
    "boto3>=1.35",
    "pika>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docrunr_runtime"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
